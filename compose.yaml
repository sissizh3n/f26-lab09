# commands: 
#   docker compose up -d --build --scale api=2
#   docker compose ps                  # each copy's own name
#   docker compose logs api            # each copy's own tokens
#   docker compose run --rm -e TOKEN=... k6 run /load/tokens.js
#   (each script's header has its exact run command)
#
# No database: each api copy keeps everything in its own memory.
services:
  api:
    build: . 
    # No ports: and no container_name:, so `--scale api=2` can start a second
    # copy. Reach a copy through the proxy, or by its own name on this network.
    expose: ["8080"]

  proxy:
    image: nginx:1.30.6-alpine
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["8080:80"]
    depends_on: [api]

  k6:
    image: grafana/k6:2.3.0
    # Only started on purpose, by `docker compose run k6 ...`, so `up` leaves it out.
    profiles: ["load"]
    volumes:
      - ./load:/load:ro
    # No depends_on on purpose. With one, `docker compose run k6` reconciles
    # proxy -> api and scales api back down to a single copy before the script
    # starts (seen in a run: api-2 was removed, distinct_upstreams came out 1).
